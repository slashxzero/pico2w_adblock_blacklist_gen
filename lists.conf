# 要合併的名單。在 GitHub 網頁上直接編輯這個檔案並 Commit，下次產生名單時就會套用；
# 也可以在 Actions -> blocklist -> Run workflow 用選單挑，選擇會自動存回這裡。

# Hagezi 主名單：light / pro / pro.plus / ultimate / none
HAGEZI=pro

# Hagezi 威脅情報（釣魚、惡意軟體）：none / tif.mini
TIF=tif.mini

# StevenBlack 基本名單：yes / no
STEVENBLACK=yes

# 其他名單網址（hosts 檔或每行一個網域），多個以空白分隔，只接受 https://
EXTRA=
